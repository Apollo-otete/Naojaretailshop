# Admin subdomain as a separate origin, served statically by nginx on the same host.
# Local test -> use static serving with a custom HTTP port or consult /etc/hosts:
#
# 1) Add to /etc/hosts (requires sudo):
#    127.0.0.1  admin.naoja.local
#
# 2) Build:
#      cd frontend && npm run build && npm run build:admin
#
# 3) nginx server blocks:
#    # storefront (www / naoja.local or :5173 in dev via Vite)
#    server {
#      listen 80;
#      server_name naoja.local;
#      root /var/www/naoja/dist;
#      index index.html;
#      try_files $uri $uri/ /index.html;
#      location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
#    }
#
#    # admin console (separate origin / separate build)
#    server {
#      listen 80;
#      server_name admin.naoja.local;
#      root /var/www/naoja/dist-admin;
#      index admin.html;
#      try_files $uri $uri/ /admin.html;
#      location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
#    }
#
# For actual dev without nginx, use Vite previews instead:
#   storefront preview  -> http://localhost:4173
#   admin console       -> npm run preview:admin   (needs /etc/hosts: 127.0.0.1 admin.naoja.local)
#   -> http://admin.naoja.local:5174/admin/
#
# Backend: ALLOWED_ORIGINS must include the admin origin for credentialed cookies/CSRF.
# Example:
#   ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://admin.naoja.local:5174,http://admin.naoja.local
